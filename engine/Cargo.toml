[package]
name = "kinetikern2"
version = "2.0.0"
edition = "2021"
rust-version = "1.74"
description = "Kinetikern2 engine for Glyphs 3: whole-font spacing and class kerning (adaptive SDF profiles, DMAT disk packing, kinetic equilibrium) as asynchronous jobs behind a C ABI."
license = "MIT"
publish = false

[lib]
name = "kinetikern2"
# Loaded by the Glyphs plugin through ctypes as libkinetikern2.dylib.
crate-type = ["cdylib"]
path = "src/lib.rs"

[dependencies]
rayon = "1.10"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
# Every export catches panics with catch_unwind so a bug can never take Glyphs down.
panic = "unwind"
debug = false
strip = "debuginfo"
